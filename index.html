<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INTO THE ETHER. — Perspective 3D Tunnel Hero</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #fafafa;
    }
    .dark body {
      background-color: #09090b;
    }
    /* Smooth 3D rendering enhancements */
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    /* Floating control bar */
    .glass-pill {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .dark .glass-pill {
      background: rgba(18, 18, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="transition-colors duration-500">

  <!-- Top Floating Controls: Dark/Light Mode, Reset & Live Photo Uploader -->
  <header class="fixed top-5 left-5 z-50 flex items-center gap-2.5">
    <div class="glass-pill rounded-xl px-3 py-1.5 shadow-lg flex items-center gap-2 text-xs font-medium">
      <button id="themeToggle" class="px-2.5 py-1 rounded-lg text-neutral-700 dark:text-neutral-200 hover:bg-black/5 dark:hover:bg-white/10 transition-colors flex items-center gap-1.5">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
      </button>
      <div class="w-px h-4 bg-neutral-300 dark:bg-neutral-700"></div>
      <button id="uploadTrigger" class="px-2.5 py-1 rounded-lg text-neutral-700 dark:text-neutral-200 hover:bg-black/5 dark:hover:bg-white/10 transition-colors flex items-center gap-1.5" title="Upload up to 9 custom images">
        <span>📷 Replace Images</span>
      </button>
      <div class="w-px h-4 bg-neutral-300 dark:bg-neutral-700"></div>
      <button id="resetBtn" class="px-2.5 py-1 rounded-lg text-neutral-700 dark:text-neutral-200 hover:bg-black/5 dark:hover:bg-white/10 transition-colors flex items-center gap-1.5" title="Reset tunnel progress to 0">
        <span>↺ Reset</span>
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple class="hidden" />
    </div>
  </header>

  <!-- Main Perspective Tunnel Viewport (100svh / 100vh, perspective: 1200px) -->
  <div
    id="tunnelContainer"
    class="relative h-[100svh] w-screen overflow-hidden bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-white select-none flex items-center justify-center transition-colors duration-500"
    style="perspective: 1200px; transform-style: preserve-3d;"
  >
    <!-- Immersive Background Grid & Radial Glow -->
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] dark:bg-[radial-gradient(#1e1b4b_1px,transparent_1px)] [background-size:28px_28px] [mask-image:radial-gradient(ellipse_70%_70%_at_50%_50%,#000_60%,transparent_100%)] opacity-70 dark:opacity-65"></div>
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(99,102,241,0.15)_0%,transparent_70%)] dark:bg-[radial-gradient(circle_at_center,rgba(99,102,241,0.2)_0%,transparent_75%)]"></div>

    <!-- Concentric Depth Ring Guides Centered in Viewport -->
    <div id="ringInner" class="pointer-events-none absolute h-[48vmin] w-[48vmin] rounded-full border border-indigo-500/15 dark:border-indigo-400/10 transition-transform duration-100 ease-out"></div>
    <div id="ringOuter" class="pointer-events-none absolute h-[76vmin] w-[76vmin] rounded-full border border-dashed border-neutral-300/60 dark:border-white/10 transition-transform duration-100 ease-out"></div>

    <!-- Central Anchor Typography -->
    <div
      id="heroTitleContainer"
      class="pointer-events-none z-0 flex flex-col items-center text-center px-6 max-w-xl will-change-transform"
      style="transform: scale(0.7); opacity: 0.25;"
    >
      <p class="text-xs font-mono uppercase tracking-[0.4em] text-indigo-600 dark:text-indigo-400 mb-4 font-semibold">
        Warp Drive Sequence
      </p>
      <h1 class="text-5xl sm:text-7xl md:text-8xl font-bold tracking-tighter leading-[0.9] bg-gradient-to-b from-neutral-950 via-neutral-800 to-neutral-400 dark:from-white dark:via-white dark:to-white/40 bg-clip-text text-transparent">
        INTO THE<br />ETHER.
      </h1>
      <p class="mt-4 max-w-[36ch] text-sm sm:text-base font-light text-neutral-600 dark:text-neutral-400">
        Scroll your trackpad or mouse wheel to fly through the spatial 3D corridor.
      </p>
    </div>

    <!-- Scroll Prompt Indicator -->
    <div
      id="scrollPrompt"
      class="pointer-events-none absolute bottom-8 z-20 flex flex-col items-center gap-2 text-xs font-mono uppercase tracking-[0.3em] text-neutral-500 dark:text-neutral-400 transition-opacity duration-300"
    >
      <span>Scroll to Explore</span>
      <div class="h-6 w-px bg-gradient-to-b from-indigo-500 to-transparent"></div>
    </div>

    <!-- 3D Z-Space Corridor Container -->
    <div
      id="corridorPlane"
      class="absolute inset-0 pointer-events-none preserve-3d"
    ></div>
  </div>

  <script>
    // 9 Exact Images Matching Component Spec
    const IMAGES = [
      { src: "https://cdn.21st.dev/assets/mirror/c3/c3fbd2afa140223999a441b32ed986f61d473930002708df805a81532a326aac.jpg", title: "Chroma I" },
      { src: "https://cdn.21st.dev/assets/mirror/9d/9d8b2f675a5814476ada3736ce439bcda23c5c389e0ebf9b25d8a0c09f3bbcfe.jpg", title: "Prism III" },
      { src: "https://cdn.21st.dev/assets/mirror/8b/8bb738bf2f00d7f7ed3c3ec034adb9938ad38f4be4ac191d632a6a11ad525574.jpg", title: "Ether IV" },
      { src: "https://cdn.21st.dev/assets/mirror/ac/ac5ac700b188d7ef16ee9dab868098b59f15c440db3f71d4e8c03262a3287577.jpg", title: "Quantum V" },
      { src: "https://cdn.21st.dev/assets/mirror/ef/ef25eff6ce655fba459b3b7e7711524dc92499aa18f6c7dbea9a0fcc56a8f908.jpg", title: "Nebula VI" },
      { src: "https://cdn.21st.dev/assets/mirror/f2/f28b370a5dcbf76240f1504579c4b05fc0ff0bb990a42aff8dc2f73a5dc46072.jpg", title: "Cyber VII" },
      { src: "https://cdn.21st.dev/assets/mirror/f2/f26a1eac85704dda924820392dedfb72d51d8261d35354f83b35d683617295f3.jpg", title: "Flux VIII" },
      { src: "https://cdn.21st.dev/assets/mirror/77/7755d23eaaa0aa5b403343f44afa7a29b2d06d3065fe54c602b14ba01d00f2aa.jpg", title: "Aether IX" },
      { src: "https://cdn.21st.dev/assets/mirror/65/657317761fe9058a1d43711b13c543a71eb5199b7a5d9abf4c28479674e39cf7.jpg", title: "Chroma X" }
    ];

    // Compute Golden Angle & Spatial Orbit offsets exactly like React component
    const TUNNEL_CARDS = IMAGES.map((item, i) => {
      const goldenAngle = i * 137.5 * (Math.PI / 180);
      const radiusFactorX = 0.28 + (i % 3) * 0.08;
      const radiusFactorY = 0.26 + (i % 2) * 0.09;
      return {
        item,
        angleCos: Math.cos(goldenAngle),
        angleSin: Math.sin(goldenAngle),
        radiusFactorX,
        radiusFactorY,
        rotationZ: (i % 2 === 0 ? 1 : -1) * (3 + (i % 5) * 2),
        index: i,
      };
    });

    const container = document.getElementById("tunnelContainer");
    const corridorPlane = document.getElementById("corridorPlane");
    const heroTitleContainer = document.getElementById("heroTitleContainer");
    const scrollPrompt = document.getElementById("scrollPrompt");
    const ringInner = document.getElementById("ringInner");
    const ringOuter = document.getElementById("ringOuter");

    let stage = {
      width: window.innerWidth,
      height: window.innerHeight,
      isMobile: window.innerWidth < 768
    };

    function updateDimensions() {
      stage.width = window.innerWidth;
      stage.height = window.innerHeight;
      stage.isMobile = window.innerWidth < 768;
      container.style.perspective = stage.isMobile ? "900px" : "1200px";
    }
    window.addEventListener("resize", updateDimensions);
    updateDimensions();

    // Build the DOM cards matching the exact Framer Motion markup
    const cardElements = TUNNEL_CARDS.map((card) => {
      const wrapper = document.createElement("div");
      wrapper.className = "pointer-events-auto absolute left-1/2 top-1/2 aspect-[4/5] will-change-transform select-none cursor-pointer";
      wrapper.style.zIndex = card.index + 1;

      wrapper.innerHTML = `
        <div class="group relative h-full w-full overflow-hidden rounded-2xl bg-neutral-200 dark:bg-neutral-900 shadow-2xl shadow-neutral-950/20 dark:shadow-black/90 ring-1 ring-black/10 dark:ring-white/15 transition-all duration-500 hover:ring-indigo-500/70 dark:hover:ring-indigo-400/70 hover:shadow-indigo-500/25">
          <img
            src="${card.item.src}"
            alt="${card.item.title}"
            draggable="false"
            class="h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent flex items-end p-4 sm:p-5">
            <span class="text-xs sm:text-sm font-mono tracking-widest uppercase text-white/95 drop-shadow-md">
              ${card.item.title}
            </span>
          </div>
        </div>
      `;

      // Allow clicking card to individually swap image
      wrapper.addEventListener("click", () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const imgEl = wrapper.querySelector("img");
            imgEl.src = URL.createObjectURL(file);
          }
        };
        input.click();
      });

      corridorPlane.appendChild(wrapper);
      return { card, wrapper };
    });

    // Spring interpolation simulation
    let rawProgress = 0;
    let smoothProgress = 0;
    let rawPointerX = 0;
    let rawPointerY = 0;
    let smoothPointerX = 0;
    let smoothPointerY = 0;

    // Mouse wheel inside viewport container
    container.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY * 0.0008;
      rawProgress = Math.min(1, Math.max(0, rawProgress + delta));
    }, { passive: false });

    // Touch support for mobile trackpad / mobile swipe
    let touchStartY = 0;
    container.addEventListener("touchstart", (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    container.addEventListener("touchmove", (e) => {
      const currentY = e.touches[0].clientY;
      const delta = (touchStartY - currentY) * 0.0016;
      touchStartY = currentY;
      rawProgress = Math.min(1, Math.max(0, rawProgress + delta));
    }, { passive: true });

    // Pointer Parallax (Camera)
    window.addEventListener("pointermove", (e) => {
      rawPointerX = (e.clientX / window.innerWidth - 0.5) * 2;
      rawPointerY = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });

    // Interpolation helper
    function lerp(start, end, factor) {
      return start + (end - start) * factor;
    }

    function mapRange(value, inMin, inMax, outMin, outMax) {
      if (inMin === inMax) return outMin;
      const t = Math.max(0, Math.min(1, (value - inMin) / (inMax - inMin)));
      return outMin + t * (outMax - outMin);
    }

    // Animation Loop
    function animate() {
      // Spring dampening
      smoothProgress = lerp(smoothProgress, rawProgress, 0.08);
      smoothPointerX = lerp(smoothPointerX, rawPointerX, 0.06);
      smoothPointerY = lerp(smoothPointerY, rawPointerY, 0.06);

      const p = smoothProgress;

      // Title Scale: [0, 0.5, 1] -> [0.7, 1, 1.35]
      let titleScale = 0.7;
      if (p <= 0.5) {
        titleScale = mapRange(p, 0, 0.5, 0.7, 1.0);
      } else {
        titleScale = mapRange(p, 0.5, 1.0, 1.0, 1.35);
      }

      // Title Opacity: [0, 0.12, 0.85, 1] -> [0.25, 1, 1, 0]
      let titleOpacity = 0.25;
      if (p < 0.12) {
        titleOpacity = mapRange(p, 0, 0.12, 0.25, 1.0);
      } else if (p <= 0.85) {
        titleOpacity = 1.0;
      } else {
        titleOpacity = mapRange(p, 0.85, 1.0, 1.0, 0.0);
      }

      heroTitleContainer.style.transform = `scale(${titleScale.toFixed(3)})`;
      heroTitleContainer.style.opacity = titleOpacity.toFixed(3);

      // Prompt Opacity: [0, 0.12] -> [1, 0]
      const promptOpacity = mapRange(p, 0, 0.12, 1.0, 0.0);
      scrollPrompt.style.opacity = promptOpacity.toFixed(3);

      // Animate rings slightly
      ringInner.style.transform = `scale(${(1 + p * 0.18).toFixed(3)})`;
      ringOuter.style.transform = `scale(${(1 + p * 0.32).toFixed(3)})`;

      // Render cards
      const total = TUNNEL_CARDS.length;
      const staggerSpan = 0.55;
      const farZ = stage.isMobile ? -1200 : -1700;
      const nearZ = stage.isMobile ? 350 : 500;
      const panStrength = stage.isMobile ? 20 : 45;

      const cardWidth = stage.isMobile
        ? Math.max(130, Math.min(180, stage.width * 0.38))
        : Math.max(180, Math.min(270, stage.width * 0.18));

      for (let i = 0; i < cardElements.length; i++) {
        const { card, wrapper } = cardElements[i];

        const start = (card.index / total) * (1 - staggerSpan);
        const end = start + staggerSpan;

        const localProgress = Math.max(0, Math.min(1, (p - start) / (end - start)));

        // Z-Depth
        const currZ = farZ + localProgress * (nearZ - farZ);

        // Opacity: [0, 0.18, 0.82, 0.98] -> [0, 1, 1, 0]
        let opacity = 0;
        if (localProgress <= 0) {
          opacity = 0;
        } else if (localProgress < 0.18) {
          opacity = localProgress / 0.18;
        } else if (localProgress <= 0.82) {
          opacity = 1;
        } else if (localProgress <= 0.98) {
          opacity = (0.98 - localProgress) / (0.98 - 0.82);
        } else {
          opacity = 0;
        }

        const baseX = card.angleCos * (stage.width * card.radiusFactorX);
        const baseY = card.angleSin * (stage.height * card.radiusFactorY);

        const offsetX = baseX - smoothPointerX * panStrength;
        const offsetY = baseY - smoothPointerY * panStrength;

        wrapper.style.width = `${cardWidth}px`;
        wrapper.style.opacity = opacity.toFixed(3);
        wrapper.style.transform = `translate3d(calc(-50% + ${offsetX.toFixed(1)}px), calc(-50% + ${offsetY.toFixed(1)}px), ${currZ.toFixed(1)}px) rotateZ(${card.rotationZ}deg)`;
        wrapper.style.pointerEvents = opacity > 0.25 ? "auto" : "none";
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Dark/Light Mode Switcher
    const html = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    // Default to dark mode like the primary aesthetic
    html.classList.add("dark");
    themeIcon.textContent = "☀️";
    themeText.textContent = "Light";

    themeToggle.addEventListener("click", () => {
      const isDark = html.classList.toggle("dark");
      themeIcon.textContent = isDark ? "☀️" : "🌙";
      themeText.textContent = isDark ? "Light" : "Dark";
    });

    // Reset button
    document.getElementById("resetBtn").addEventListener("click", () => {
      rawProgress = 0;
    });

    // Bulk Image Upload
    const uploadTrigger = document.getElementById("uploadTrigger");
    const fileInput = document.getElementById("fileInput");

    uploadTrigger.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files).slice(0, 9);
      files.forEach((file, idx) => {
        if (cardElements[idx]) {
          const imgEl = cardElements[idx].wrapper.querySelector("img");
          imgEl.src = URL.createObjectURL(file);
        }
      });
    });
  </script>
</body>
</html>
